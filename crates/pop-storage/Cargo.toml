[package]
name = "pop-storage"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
autotests = false

[lints]
workspace = true

[features]
bundled-sqlite = ["rusqlite/bundled"]

[dependencies]
pop-core = { path = "../pop-core" }
pop-contracts = { path = "../pop-contracts" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
rusqlite = { workspace = true, features = ["backup", "blob", "limits"] }
sha2.workspace = true
data-encoding.workspace = true
brotli.workspace = true
png.workspace = true
libc.workspace = true
oxipng = { version = "=10.2.1", default-features = false }

[dev-dependencies]
pop-testkit = { path = "../pop-testkit" }
loro.workspace = true
rusqlite = { workspace = true, features = ["hooks"] }
tempfile.workspace = true

[[test]]
name = "storage"
path = "tests/main.rs"

[build-dependencies]
cc = "=1.5.1"
