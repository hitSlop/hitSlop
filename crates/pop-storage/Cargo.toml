[package]
name = "pop-storage"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
autotests = false

[lints]
workspace = true

[features]
bundled-sqlite = ["rusqlite/bundled"]

[dependencies]
pop-core = { path = "../pop-core", default-features = false }
pop-contracts = { path = "../pop-contracts" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
rusqlite = { version = "=0.40.2", features = ["backup", "blob", "limits"] }
sha2 = "=0.11.0"
data-encoding = "=2.11.1"
brotli = "=9.0.0"
png = "=0.18.1"
getrandom = "0.2"
libc = "0.2"
oxipng = { version = "=10.2.1", default-features = false }

[dev-dependencies]
loro.workspace = true
rusqlite = { version = "=0.40.2", features = ["hooks"] }
tempfile = "3"

[[test]]
name = "storage"
path = "tests/main.rs"

[build-dependencies]
cc = "=1.5.1"
