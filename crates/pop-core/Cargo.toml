[package]
name = "pop-core"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
# One integration-test binary (tests/main.rs), not one per file.
autotests = false

[lints]
workspace = true

[dependencies]
pop-contracts = { path = "../pop-contracts" }
pop-sharing-protocol = { path = "../pop-sharing-protocol" }
loro.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
getrandom = "0.2"
sha2 = "=0.11.0"
svgtypes = "=0.16.1"
kurbo = "=0.13.1"
ts-rs = { version = "=12.0.1", optional = true, features = ["serde-json-impl", "no-serde-warnings"] }

fluent-uri = { version = "=0.4.1" }
# Compressed historical acceptance fixtures are opt-in tooling, not semantic runtime dependencies.
brotli = { version = "=9.0.0", optional = true }
data-encoding = { version = "=2.11.1", optional = true }

[lib]
doctest = false

[features]
default = []
# Code generation only; never enabled by the WASM build or shipped native library.
ts = ["pop-contracts/ts", "pop-sharing-protocol/ts", "pop-sharing-protocol/openapi", "dep:ts-rs"]
acceptance = ["dep:brotli", "dep:data-encoding"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }

[dev-dependencies]
# Differential oracle for the output-only argument projection. Production uses Node.
jsonschema = { version = "=0.58.3", default-features = false }

[[test]]
name = "core"
path = "tests/main.rs"

[[example]]
name = "export_bindings"
required-features = ["ts"]
