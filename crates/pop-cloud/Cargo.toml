[package]
name = "pop-cloud"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
autotests = false

[lints]
workspace = true

[dependencies]
pop-contracts = { path = "../pop-contracts" }
pop-core = { path = "../pop-core", default-features = false }
pop-storage = { path = "../pop-storage", default-features = false }
pop-runtime = { path = "../pop-runtime", default-features = false }
pop-sharing-protocol = { path = "../pop-sharing-protocol" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
loro.workspace = true
rusqlite = { version = "=0.40.2" }
sha2 = "=0.11.0"
getrandom = "0.2"
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls-webpki-roots"] }
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "net", "time", "macros", "sync"] }
tokio-util = { version = "=0.7.20", features = ["rt"] }
tokio-tungstenite = { version = "=0.29.0", default-features = false, features = ["handshake"] }
futures-util = { version = "=0.3.34", features = ["sink"] }

[dev-dependencies]
png = "=0.18.1"
tempfile = "3"

[[test]]
name = "cloud"
path = "tests/main.rs"
