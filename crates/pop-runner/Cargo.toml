[package]
name = "pop-runner"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
autotests = false

[lints]
workspace = true

[features]
default = ["process", "child", "capture"]
process = []
# The evaluator process itself. Hosts that only spawn it depend without default features.
child = ["process", "evaluation", "dep:seccompiler"]
evaluation = ["dep:rquickjs"]
# In-process PNG artwork/widget capture for iOS. Commands stay unavailable.
capture-in-process = ["capture", "dep:rquickjs-sys"]

capture = ["evaluation", "dep:takumi", "dep:takumi-pdf", "dep:base64", "dep:png"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
pop-contracts = { path = "../pop-contracts" }
rquickjs = { version = "=0.14.0", optional = true }
# Enable generated iOS bindings directly: rquickjs/bindgen also resolves its
# unpublished optional rquickjs-macro 0.14 dependency.
rquickjs-sys = { version = "=0.14.0", features = ["bindgen"], optional = true }
libc = "0.2"
takumi = { git = "https://github.com/kane50613/takumi", rev = "e527358cbd9b4f5deb361f56ef2cb02a88759f2b", version = "=2.15.1", default-features = false, features = ["unstable", "raster-backend", "from-html", "svg-source", "png", "jpeg", "gif", "webp", "woff2"], optional = true }
takumi-pdf = { git = "https://github.com/kane50613/takumi", rev = "e527358cbd9b4f5deb361f56ef2cb02a88759f2b", version = "=0.16.1", optional = true }
base64 = { version = "0.22", optional = true }
png = { version = "=0.18.1", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
seccompiler = { version = "0.5", default-features = false, optional = true }

[dev-dependencies]
base64 = "0.22"
tempfile = "3"
png = "=0.18.1"

[[bin]]
name = "pop-evaluator"
path = "src/main.rs"
required-features = ["child"]

[[test]]
name = "runner"
path = "tests/main.rs"

[[test]]
name = "broken_pipe"
path = "tests/broken_pipe.rs"
