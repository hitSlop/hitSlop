[package]
name = "pop-runner"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
autotests = false

[lints]
workspace = true

[features]
default = []
# The evaluator process itself.
child = ["dep:rquickjs", "dep:seccompiler"]
# In-process PNG artwork/widget capture for iOS. Commands stay unavailable.
in-process = ["capture", "dep:rquickjs-sys"]

capture = ["dep:rquickjs", "dep:takumi", "dep:takumi-pdf", "dep:png"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
pop-contracts = { path = "../pop-contracts" }
rquickjs = { version = "=0.14.0", optional = true }
# Enable generated iOS bindings directly: rquickjs/bindgen also resolves its
# unpublished optional rquickjs-macro 0.14 dependency.
rquickjs-sys = { version = "=0.14.0", features = ["bindgen"], optional = true }
libc.workspace = true
takumi = { git = "https://github.com/kane50613/takumi", rev = "e527358cbd9b4f5deb361f56ef2cb02a88759f2b", version = "=2.15.1", default-features = false, features = ["unstable", "raster-backend", "from-html", "svg-source", "png", "jpeg", "gif", "webp", "woff2"], optional = true }
takumi-pdf = { git = "https://github.com/kane50613/takumi", rev = "e527358cbd9b4f5deb361f56ef2cb02a88759f2b", version = "=0.16.1", optional = true }
base64 = "0.22"
png = { workspace = true, optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
seccompiler = { version = "0.5", optional = true }

[dev-dependencies]
base64 = "0.22"
tempfile.workspace = true
png.workspace = true

[[test]]
name = "runner"
path = "tests/main.rs"

[[test]]
name = "broken_pipe"
path = "tests/broken_pipe.rs"
