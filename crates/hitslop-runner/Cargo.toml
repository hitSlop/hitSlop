[package]
name = "hitslop-runner"
version = "0.0.0"
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = ["child"]
# The evaluator process itself. Hosts that only spawn it depend without default features.
child = ["dep:rquickjs", "dep:seccompiler"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
rquickjs = { version = "=0.14.0", optional = true }
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
seccompiler = { version = "0.5", default-features = false, optional = true }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "hitslop-evaluator"
path = "src/main.rs"
required-features = ["child"]
