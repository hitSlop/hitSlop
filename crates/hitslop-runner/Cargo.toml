[package]
name = "hitslop-runner"
version = "0.0.0"
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = ["child", "capture"]
# The evaluator process itself. Hosts that only spawn it depend without default features.
child = ["dep:rquickjs", "dep:seccompiler"]

capture = ["child", "dep:takumi", "dep:base64", "dep:png", "dep:takumi-pdf"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
rquickjs = { version = "=0.14.0", optional = true }
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
libc = "0.2"
takumi = { git = "https://github.com/kane50613/takumi", rev = "e527358cbd9b4f5deb361f56ef2cb02a88759f2b", version = "=2.15.1", default-features = false, features = ["unstable", "raster-backend", "from-html", "svg-source", "png", "jpeg", "gif", "webp", "woff2"], optional = true }
takumi-pdf = { git = "https://github.com/kane50613/takumi", rev = "e527358cbd9b4f5deb361f56ef2cb02a88759f2b", version = "=0.16.1", optional = true }
base64 = { version = "0.22", optional = true }
png = { version = "=0.18.1", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
seccompiler = { version = "0.5", default-features = false, optional = true }

[dev-dependencies]
tempfile = "3"
png = "=0.18.1"

[[bin]]
name = "hitslop-evaluator"
path = "src/main.rs"
required-features = ["child"]
