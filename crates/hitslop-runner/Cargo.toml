[package]
name = "hitslop-runner"
version = "0.0.0"
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
rquickjs = "=0.14.0"
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
seccompiler = { version = "0.5", default-features = false }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "hitslop-evaluator"
path = "src/main.rs"
