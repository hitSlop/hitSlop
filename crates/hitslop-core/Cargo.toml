[package]
name = "hitslop-core"
version = "0.0.0"
edition.workspace = true
publish.workspace = true

[dependencies]
loro.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
getrandom = "0.2"

[features]
schema-validation = ["dep:jsonschema"]
# Durable storage for native hosts: SQLite, the writer lock and the save policy. Links
# the platform's SQLite, the one library every other in-process user (Firebase) loads.
storage = ["dep:rusqlite", "dep:libc"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
jsonschema = { version = "=0.58.3", default-features = false, features = ["macros"], optional = true }
rusqlite = { version = "=0.40.2", features = ["backup", "limits"], optional = true }
libc = { version = "0.2", optional = true }

[dev-dependencies]
tempfile = "3"

[[test]]
name = "store"
required-features = ["storage"]

[[test]]
name = "compat"
required-features = ["storage"]

[[example]]
name = "store_cost"
required-features = ["storage"]

[[example]]
name = "compat_anomalies"
required-features = ["storage"]
