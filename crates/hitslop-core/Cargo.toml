[package]
name = "hitslop-core"
version = "0.0.0"
edition.workspace = true
publish.workspace = true
# One integration-test binary (tests/main.rs), not one per file.
autotests = false

[lints]
workspace = true

[dependencies]
hitslop-sharing-protocol = { path = "../hitslop-sharing-protocol" }
loro.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
thiserror.workspace = true
getrandom = "0.2"
svgtypes = "=0.16.1"
kurbo = "=0.13.1"
ts-rs = { version = "=12.0.1", optional = true, features = ["serde-json-impl", "no-serde-warnings"] }

fluent-uri = { version = "=0.4.1", optional = true }
rusqlite = { version = "=0.40.2", features = ["backup", "blob", "limits"], optional = true }
sha2 = { version = "=0.11.0", optional = true }
data-encoding = { version = "=2.11.1", optional = true }
# Brotli for the app's stored text assets, which every release must keep decoding. Only
# `pack` encodes; the app links the decoder.
brotli = { version = "=9.0.0", optional = true }
png = { version = "=0.18.1", optional = true }

[lib]
doctest = false

[features]
default = ["storage", "desktop"]
# Desktop process execution and socket hosting. Mobile hosts keep the same owner and
# durable storage without linking a child-process implementation.
desktop = ["storage", "hitslop-runner/process"]
mobile-capture = ["storage", "hitslop-runner/capture-in-process"]
# Local CloudKit whole-file feasibility harness; not enabled by shipping hosts.
snapshot-spike = ["storage"]
# Code generation only; never enabled by the WASM build or shipped native library.
ts = ["hitslop-sharing-protocol/ts", "hitslop-sharing-protocol/openapi", "dep:ts-rs", "storage", "hitslop-runner/ts"]
# Durable storage for native hosts: the document file (SQLite), the writer lock and the
# save policy. Links the platform's SQLite, the one library every other in-process user
# (Firebase) loads. Opening checks the app, so it also needs the manifest validator.
storage = ["dep:hitslop-runner", "dep:rusqlite", "dep:libc", "dep:sha2", "dep:brotli", "dep:data-encoding", "dep:oxipng", "dep:png", "dep:fluent-uri"]
# SQLite's own amalgamation instead of the platform's, for the engine on platforms without
# one. Never for the app.
bundled-sqlite = ["storage", "rusqlite/bundled"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
hitslop-runner = { path = "../hitslop-runner", optional = true, default-features = false }
libc = { version = "0.2", optional = true }
# Lossless PNG optimization for stored artwork (`pack`, and a closing window's): no
# threads, no zopfli. It compiles libdeflate (C), so the wasm core never links it.
oxipng = { version = "=10.2.1", default-features = false, optional = true }

[dev-dependencies]
rusqlite = { version = "=0.40.2", features = ["hooks"] }
png = "=0.18.1"
tempfile = "3"
# Differential oracle for the output-only argument projection. Production uses Node.
jsonschema = { version = "=0.58.3", default-features = false }

[[test]]
name = "core"
path = "tests/main.rs"

[[example]]
name = "compat_checkpoint"
required-features = ["storage"]

[[example]]
name = "export_bindings"
required-features = ["ts"]

[build-dependencies]
cc = "=1.5.1"
