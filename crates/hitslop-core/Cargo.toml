[package]
name = "hitslop-core"
version = "0.0.0"
edition.workspace = true
publish.workspace = true

[dependencies]
loro.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
thiserror.workspace = true
getrandom = "0.2"

[features]
schema-validation = ["dep:jsonschema"]
# Durable storage for native hosts: the document file (SQLite), the writer lock and the
# save policy. Links the platform's SQLite, the one library every other in-process user
# (Firebase) loads. Opening checks the app, so it also needs the manifest validator.
storage = ["dep:rusqlite", "dep:libc", "dep:sha2", "dep:brotli", "schema-validation"]
# SQLite's own amalgamation instead of the platform's, for the engine on platforms without
# one. Never for the app.
bundled-sqlite = ["storage", "rusqlite/bundled"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
jsonschema = { version = "=0.58.3", default-features = false, features = ["macros"], optional = true }
rusqlite = { version = "=0.40.2", features = ["backup", "blob", "limits"], optional = true }
sha2 = { version = "=0.11.0", optional = true }
libc = { version = "0.2", optional = true }
# Brotli for the app's stored text assets, which every release must keep decoding. Only
# `pack` encodes; the app links the decoder.
brotli = { version = "=9.0.0", optional = true }

[dev-dependencies]
tempfile = "3"

[[test]]
name = "file"
required-features = ["storage"]

[[test]]
name = "store"
required-features = ["storage"]

[[test]]
name = "compat"
required-features = ["storage"]

[[example]]
name = "store_cost"
required-features = ["storage"]

[[example]]
name = "compat_anomalies"
required-features = ["storage"]
