[package]
name = "tinys-sharing-protocol"
version = "0.0.0"
edition.workspace = true
publish.workspace = true
[lints]
workspace = true
[features]
ts = ["dep:ts-rs"]
openapi = ["dep:utoipa"]
[dependencies]
serde.workspace = true
serde_json.workspace = true
serde_bytes = "=0.11.19"
postcard = { version = "=1.1.3", features = ["alloc"] }
ts-rs = { version = "=12.0.1", optional = true, features = ["serde-json-impl", "no-serde-warnings"] }
utoipa = { version = "=6.0.0", optional = true }

[[example]]
name = "openapi"
required-features = ["openapi"]
