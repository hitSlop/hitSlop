[package]
name = "hitslop-core-ffi"
version = "0.0.0"
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
crate-type = ["cdylib", "staticlib"]
doctest = false

[dependencies]
hitslop-sharing-client = { path = "../hitslop-sharing-client" }
hitslop-core = { path = "../hitslop-core", default-features = false, features = ["storage"] }
# Without its default `cargo-metadata`, which only the bindings generator uses: every host
# build then shares one dependency graph. The generator is installed on its own
# (crates/README.md).
uniffi = { version = "=0.32.2", default-features = false }
thiserror.workspace = true

[features]
default = ["desktop"]
desktop = ["hitslop-core/desktop"]


mobile-capture = ["hitslop-core/mobile-capture"]
