[package]
name = "hitslop-core-ffi"
version = "0.0.0"
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "staticlib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bindgen.rs"
required-features = ["cli"]

[features]
cli = ["uniffi/cli"]

[dependencies]
hitslop-core = { path = "../hitslop-core" }
uniffi = "=0.31.1"
thiserror.workspace = true

