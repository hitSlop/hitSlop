[package]
name = "pop-core-wasm"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
crate-type = ["cdylib"]
test = false
doctest = false

[dependencies]
pop-core = { path = "../pop-core", default-features = false }

# Only the WASM build compiles the adapter: on the host, wasm-bindgen's proc macros would
# change the features of every other proc macro, and so the whole host graph.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.129"
js-sys = "=0.3.106"
