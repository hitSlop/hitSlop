[package]
name = "pop-engine"
version = "0.0.0"
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

# The file engine `pop` runs: it builds and reads `.pop` files on any platform, by
# the rules the app opens them with.
[dependencies]
pop-core = { path = "../pop-core", features = ["storage"] }
serde_json.workspace = true
pop-runner = { path = "../pop-runner" }
libc = "0.2"
data-encoding = { version = "=2.11.1" }

[features]
# SQLite's own amalgamation, for platforms without a system SQLite (release builds only:
# the app and tests link the platform library).
bundled-sqlite = ["pop-core/bundled-sqlite"]

[dev-dependencies]
tempfile = "3"
png = "=0.18.1"
