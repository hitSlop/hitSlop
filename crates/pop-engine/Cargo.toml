[package]
name = "pop-engine"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

# The file engine `pop` runs: it builds and reads `.pop` files on any platform, by
# the rules the app opens them with.
[dependencies]
pop-contracts = { path = "../pop-contracts" }
pop-core = { path = "../pop-core" }
pop-storage = { path = "../pop-storage" }
pop-runtime = { path = "../pop-runtime" }
serde_json.workspace = true
pop-runner = { path = "../pop-runner", default-features = false, features = ["child", "capture"] }
libc.workspace = true
data-encoding = { workspace = true }

[features]
# SQLite's own amalgamation, for platforms without a system SQLite (release builds only:
# the app and tests link the platform library).
bundled-sqlite = ["pop-storage/bundled-sqlite"]

[dev-dependencies]
tempfile.workspace = true
png.workspace = true
