SaveStatus = "OwnerSaveStatus"
Event = "OwnerEvent"
Request = "OwnerRequest"
Origin = "EditOrigin"
Mode = "StoreMode"
Kind = "FileKind"
Silhouette = "WindowSilhouette"
Segment = "SilhouetteSegment"
Length = "SilhouetteLength"
ExportFormat = "WireExportFormat"
OutcomeCode = "WireOutcomeCode"
Code = "WireCoreErrorCode"
Category = "PopCategory"
ThemeInput = "ThemeToken"
"ThemeInput.token" = "name"
"ThemeInput.color" = "value"
Summary = "FileSummary"

Entry = "LibraryEntry"
Issue = "LibraryIssue"

Phase = "SharingPhase"
ClientStatus = "SharingStatus"
