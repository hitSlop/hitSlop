[package]
name = "pop-runtime"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
autotests = false

[lints]
workspace = true

[dependencies]
pop-core = { path = "../pop-core" }
pop-contracts = { path = "../pop-contracts" }
pop-storage = { path = "../pop-storage" }
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
thiserror.workspace = true
data-encoding.workspace = true
sha2.workspace = true
libc.workspace = true

[dev-dependencies]
pop-testkit = { path = "../pop-testkit" }
brotli.workspace = true
loro.workspace = true
rusqlite = { workspace = true, features = ["hooks"] }
png.workspace = true
tempfile.workspace = true

[[test]]
name = "runtime"
path = "tests/main.rs"

[target.'cfg(target_os = "ios")'.dependencies]
pop-runner = { path = "../pop-runner", default-features = false, features = ["in-process"] }

[target.'cfg(not(target_os = "ios"))'.dependencies]
pop-runner = { path = "../pop-runner", default-features = false }
