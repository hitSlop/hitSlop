[package]
name = "pop-contracts"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
autotests = false

[lints]
workspace = true

[features]
ts = ["dep:ts-rs"]

[dependencies]
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
thiserror.workspace = true
ts-rs = { workspace = true, optional = true, features = ["serde-json-impl", "no-serde-warnings"] }

[[test]]
name = "contracts"
path = "tests/main.rs"
