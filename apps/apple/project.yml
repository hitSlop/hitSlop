name: hitSlop
options:
  bundleIdPrefix: com.hitslop
  deploymentTarget:
    macOS: "15.2"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: 78UAXU8QG8
    CODE_SIGN_STYLE: Automatic
    # The app and its extensions ship as one version.
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "31"
packages:
  HitSlopApple:
    path: Packages/HitSlopApple
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0
targets:
  hitSlop-macOS:
    type: application
    productName: hitSlop
    platform: macOS
    sources:
      - path: App/Shared/Assets.xcassets
      - path: App/macOS
        excludes:
          - ExportOptions.plist
          - Info.plist
          - GoogleService-Info.plist
      - path: App/macOS/GoogleService-Info.plist
        buildPhase: resources
    dependencies:
      - package: HitSlopApple
        product: HitSlopHost
      - package: HitSlopApple
        product: HitSlopCatalog
      - package: HitSlopApple
        product: HitSlopDocument
      - package: HitSlopApple
        product: HitSlopCore
      - package: HitSlopApple
        product: HitSlopFirebase
      - package: Sparkle
        product: Sparkle
      - target: hitSlop-QuickLookThumbnail
      - target: hitSlop-QuickLookPreview
    postCompileScripts:
      - name: Embed starter templates
        basedOnDependencyAnalysis: false
        script: '"${SRCROOT}/../../scripts/templates/embed-starter-templates.sh" "${TARGET_BUILD_DIR}/${WRAPPER_NAME}"'
      - name: Embed hitslop-native
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          case "${CONFIGURATION:-}" in
            Release) ;;
            *) exit 0 ;;
          esac
          export HITSLOP_NATIVE_ARCHS="${ARCHS:-}"
          "${SRCROOT}/../../scripts/build/embed-hitslop-native.sh" "${TARGET_BUILD_DIR}/${WRAPPER_NAME}"
    postBuildScripts:
      - name: Upload Crashlytics symbols
        basedOnDependencyAnalysis: false
        inputFiles:
          - $(DWARF_DSYM_FOLDER_PATH)/$(DWARF_DSYM_FILE_NAME)
          - $(DWARF_DSYM_FOLDER_PATH)/$(DWARF_DSYM_FILE_NAME)/Contents/Resources/DWARF/$(PRODUCT_NAME)
          - $(DWARF_DSYM_FOLDER_PATH)/$(DWARF_DSYM_FILE_NAME)/Contents/Info.plist
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/GoogleService-Info.plist
          - $(TARGET_BUILD_DIR)/$(EXECUTABLE_PATH)
        script: |
          set -euo pipefail
          case "${CONFIGURATION:-}" in
            Release) ;;
            *) exit 0 ;;
          esac
          if [ "${CODE_SIGNING_ALLOWED:-YES}" = "NO" ]; then
            exit 0
          fi
          "${BUILD_DIR%/Build/*}/SourcePackages/checkouts/firebase-ios-sdk/Crashlytics/run"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hitslop.app
        PRODUCT_NAME: hitSlop
        INFOPLIST_FILE: App/macOS/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/macOS/hitSlop.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MACOSX_DEPLOYMENT_TARGET: "15.2"
        ENABLE_HARDENED_RUNTIME: YES
        OTHER_LDFLAGS: $(inherited) -ObjC
        SKIP_INSTALL: NO
      configs:
        Release:
          DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
          ENABLE_DEBUG_DYLIB: NO
  # Quick Look reads a document's artwork through the core, read-only, in a sandbox: what
  # Finder, Mail and the share sheet show for a `.slop` that left this Mac.
  hitSlop-QuickLookThumbnail:
    type: app-extension
    platform: macOS
    sources: [App/QuickLookThumbnail]
    dependencies:
      - package: HitSlopApple
        product: HitSlopCore
      - sdk: QuickLookThumbnailing.framework
    info:
      path: App/QuickLookThumbnail/Info.plist
      properties:
        CFBundleDisplayName: hitSlop Thumbnail
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.quicklook.thumbnail
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ThumbnailProvider
          NSExtensionAttributes:
            QLSupportedContentTypes: [com.hitslop.slop]
            QLThumbnailMinimumDimension: 0
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hitslop.app.quicklook-thumbnail
        CODE_SIGN_ENTITLEMENTS: App/QuickLookThumbnail/QuickLookThumbnail.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        SKIP_INSTALL: YES
  hitSlop-QuickLookPreview:
    type: app-extension
    platform: macOS
    sources: [App/QuickLookPreview]
    dependencies:
      - package: HitSlopApple
        product: HitSlopCore
      - sdk: QuickLookUI.framework
    info:
      path: App/QuickLookPreview/Info.plist
      properties:
        CFBundleDisplayName: hitSlop Preview
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.quicklook.preview
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PreviewProvider
          NSExtensionAttributes:
            QLIsDataBasedPreview: true
            QLSupportedContentTypes: [com.hitslop.slop]
            QLSupportsSearchableItems: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hitslop.app.quicklook-preview
        CODE_SIGN_ENTITLEMENTS: App/QuickLookPreview/QuickLookPreview.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        SKIP_INSTALL: YES
schemes:
  hitSlop-macOS:
    build:
      targets:
        hitSlop-macOS: all
    run:
      config: Debug
      executable: hitSlop-macOS
    profile:
      config: Release
      executable: hitSlop-macOS
