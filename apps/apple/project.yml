name: pop
options:
  bundleIdPrefix: com.hitslop
  deploymentTarget:
    macOS: "15.2"
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: 78UAXU8QG8
    CODE_SIGN_STYLE: Automatic
    # The app and its extensions ship as one version.
    MARKETING_VERSION: "1.4.0"
    CURRENT_PROJECT_VERSION: "50"
packages:
  PopApple:
    path: Packages/PopApple
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0
targets:
  pop-iOS:
    type: application
    productName: dotpopPhone
    platform: iOS
    sources:
      - path: App/iOS
        excludes: [Info.plist, pop.entitlements]
      - path: App/Shared/WidgetIntent.swift
      - path: App/macOS/GoogleService-Info.plist
        buildPhase: resources
      - path: App/Shared/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: App/Shared/Assets.xcassets
      - path: ../../generated/ios/StarterTemplates
        type: folder
        buildPhase: resources
    dependencies:
      - package: PopApple
        product: PopCore
      - package: PopApple
        product: PopDocument
      - package: PopApple
        product: PopAccount
      - package: PopApple
        product: PopWidgets
      - package: PopApple
        product: PopLaunch
      - target: pop-iOS-Widgets
      - target: pop-iOS-Thumbnail
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hitslop.app
        PRODUCT_NAME: dotpopPhone
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: App/iOS/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/iOS/pop.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        SKIP_INSTALL: NO
  pop-iOS-Widgets:
    type: app-extension
    platform: iOS
    sources:
      - App/Widgets/PopImageWidget.swift
      - App/Shared/WidgetIntent.swift
      - path: App/Shared/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: PopApple
        product: PopWidgets
      - sdk: WidgetKit.framework
    info:
      path: App/iOSWidgets/Info.plist
      properties:
        CFBundleDisplayName: dotpop
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hitslop.app.widgets
        CODE_SIGN_ENTITLEMENTS: App/iOSWidgets/Widgets.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
  pop-iOS-Thumbnail:
    type: app-extension
    platform: iOS
    sources:
      - path: App/QuickLookThumbnail
        excludes: [Info.plist, QuickLookThumbnail.entitlements]
      - path: App/Shared/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: PopApple
        product: PopCore
      - sdk: QuickLookThumbnailing.framework
    info:
      path: App/iOSThumbnail/Info.plist
      properties:
        CFBundleDisplayName: dotpop Thumbnail
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.quicklook.thumbnail
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ThumbnailProvider
          NSExtensionAttributes:
            QLSupportedContentTypes: [click.dotpop.document]
            QLThumbnailMinimumDimension: 0
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hitslop.app.quicklook-thumbnail
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
  pop-iOS-Tests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/iOS
      - path: ../../generated/ios/Fixtures
        type: folder
        buildPhase: resources
    dependencies:
      - target: pop-iOS
      - package: PopApple
        product: PopCore
      - package: PopApple
        product: PopDocument
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hitslop.app.tests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/dotpopPhone.app/dotpopPhone
        BUNDLE_LOADER: $(TEST_HOST)
  pop-iOS-UITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Tests/iOSUI]
    dependencies:
      - target: pop-iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hitslop.app.uitests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
        TEST_TARGET_NAME: pop-iOS
  pop-macOS:
    type: application
    productName: dotpop
    platform: macOS
    sources:
      - path: App/Shared/Assets.xcassets
      - path: App/Shared/WidgetIntent.swift
      - path: App/macOS
        excludes:
          - ExportOptions.plist
          - Info.plist
          - GoogleService-Info.plist
      - path: App/macOS/GoogleService-Info.plist
        buildPhase: resources
    dependencies:
      - package: PopApple
        product: PopHost
      - package: PopApple
        product: PopCatalog
      - package: PopApple
        product: PopDocument
      - package: PopApple
        product: PopCore
      - package: PopApple
        product: PopFirebase
      - package: PopApple
        product: PopAccount
      - package: Sparkle
        product: Sparkle
      - target: pop-QuickLookThumbnail
      - target: pop-QuickLookPreview
      - target: pop-Widgets
      - package: PopApple
        product: PopWidgets
    postCompileScripts:
      - name: Embed command evaluator
        basedOnDependencyAnalysis: false
        script: '/bin/sh "${SRCROOT}/../../scripts/build/embed-pop-evaluator.sh" "${TARGET_BUILD_DIR}/${WRAPPER_NAME}"'
      - name: Embed starter templates
        basedOnDependencyAnalysis: false
        script: '"${SRCROOT}/../../scripts/templates/embed-starter-templates.sh" "${TARGET_BUILD_DIR}/${WRAPPER_NAME}"'
    postBuildScripts:
      - name: Upload Crashlytics symbols
        basedOnDependencyAnalysis: false
        inputFiles:
          - $(DWARF_DSYM_FOLDER_PATH)/$(DWARF_DSYM_FILE_NAME)
          - $(DWARF_DSYM_FOLDER_PATH)/$(DWARF_DSYM_FILE_NAME)/Contents/Resources/DWARF/$(PRODUCT_NAME)
          - $(DWARF_DSYM_FOLDER_PATH)/$(DWARF_DSYM_FILE_NAME)/Contents/Info.plist
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/GoogleService-Info.plist
          - $(TARGET_BUILD_DIR)/$(EXECUTABLE_PATH)
        script: |
          set -euo pipefail
          case "${CONFIGURATION:-}" in
            Release) ;;
            *) exit 0 ;;
          esac
          if [ "${POP_SKIP_SYMBOL_UPLOAD:-0}" = "1" ] || [ "${CODE_SIGNING_ALLOWED:-YES}" = "NO" ]; then
            exit 0
          fi
          "${BUILD_DIR%/Build/*}/SourcePackages/checkouts/firebase-ios-sdk/Crashlytics/run"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hitslop.app
        PRODUCT_NAME: dotpop
        INFOPLIST_FILE: App/macOS/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MACOSX_DEPLOYMENT_TARGET: "15.2"
        ENABLE_HARDENED_RUNTIME: YES
        OTHER_LDFLAGS: $(inherited) -ObjC
        SKIP_INSTALL: NO
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: App/macOS/pop.entitlements
        Release:
          POP_RELEASE_ENTITLEMENTS: App/macOS/pop.Release.entitlements
          CODE_SIGN_ENTITLEMENTS: $(POP_RELEASE_ENTITLEMENTS)
          PROVISIONING_PROFILE_SPECIFIER: $(POP_PROVISIONING_PROFILE_UUID)
          DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
          ENABLE_DEBUG_DYLIB: NO
  pop-Widgets:
    type: app-extension
    platform: macOS
    sources:
      - App/Widgets
      # Intent types must belong to each bundle, not a static Swift package.
      - App/Shared/WidgetIntent.swift
    dependencies:
      - package: PopApple
        product: PopWidgets
      - sdk: WidgetKit.framework
    info:
      path: App/Widgets/Info.plist
      properties:
        CFBundleDisplayName: dotpop
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hitslop.app.widgets
        CODE_SIGN_ENTITLEMENTS: App/Widgets/Widgets.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        SKIP_INSTALL: YES
  # Quick Look reads a document's artwork through the core, read-only, in a sandbox: what
  # Finder, Mail and the share sheet show for a `.pop` that left this Mac.
  pop-QuickLookThumbnail:
    type: app-extension
    platform: macOS
    sources: [App/QuickLookThumbnail]
    dependencies:
      - package: PopApple
        product: PopCore
      - sdk: QuickLookThumbnailing.framework
    info:
      path: App/QuickLookThumbnail/Info.plist
      properties:
        CFBundleDisplayName: dotpop Thumbnail
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.quicklook.thumbnail
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ThumbnailProvider
          NSExtensionAttributes:
            QLSupportedContentTypes: [click.dotpop.document]
            QLThumbnailMinimumDimension: 0
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hitslop.app.quicklook-thumbnail
        CODE_SIGN_ENTITLEMENTS: App/QuickLookThumbnail/QuickLookThumbnail.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        SKIP_INSTALL: YES
  pop-QuickLookPreview:
    type: app-extension
    platform: macOS
    sources: [App/QuickLookPreview]
    dependencies:
      - package: PopApple
        product: PopCore
      - sdk: QuickLookUI.framework
    info:
      path: App/QuickLookPreview/Info.plist
      properties:
        CFBundleDisplayName: dotpop Preview
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.quicklook.preview
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PreviewProvider
          NSExtensionAttributes:
            QLIsDataBasedPreview: true
            QLSupportedContentTypes: [click.dotpop.document]
            QLSupportsSearchableItems: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hitslop.app.quicklook-preview
        CODE_SIGN_ENTITLEMENTS: App/QuickLookPreview/QuickLookPreview.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        SKIP_INSTALL: YES
schemes:
  pop-iOS:
    build:
      targets:
        pop-iOS: all
    test:
      targets:
        - name: pop-iOS-Tests
          parallelizable: false
        - name: pop-iOS-UITests
          parallelizable: false
      gatherCoverageData: false
  pop-macOS:
    build:
      targets:
        pop-macOS: all
    run:
      config: Debug
      executable: pop-macOS
    profile:
      config: Release
      executable: pop-macOS
