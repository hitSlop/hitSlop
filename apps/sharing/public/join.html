<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Open a shared pop</title>
    <meta name="description" content="Open this invitation in dotpop to edit together." />
    <meta property="og:title" content="Open a shared pop" />
    <meta property="og:site_name" content="dotpop" />
    <meta property="og:type" content="website" />
    <meta property="og:description" content="Open this invitation in dotpop to edit together." />
    <meta property="og:image" content="https://share.dotpop.click/share-icon.png" />
    <meta property="og:image:alt" content="dotpop app icon" />
    <link rel="icon" type="image/png" href="https://share.dotpop.click/share-icon.png" />
    <link rel="apple-touch-icon" href="https://share.dotpop.click/share-icon.png" />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f6f7f6;
        --text: #1b1e1c;
        --muted: #5b625e;
        --link: #1f6b3a;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #171918;
          --text: #eeeeee;
          --muted: #bfc8c2;
          --link: #afd8b8;
        }
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--text);
        font: 16px/1.5 system-ui, sans-serif;
      }
      main {
        max-width: 28rem;
        padding: 2rem 1rem;
      }
      h1 {
        margin: 0 0 0.75rem;
        font-size: 1.5rem;
      }
      p {
        margin: 0 0 1rem;
        color: var(--muted);
      }
      #open-dotpop {
        display: inline-block;
        padding: 0.75rem 1.25rem;
        border-radius: 0.75rem;
        background: var(--link);
        color: var(--bg);
        font-weight: 600;
        text-decoration: none;
      }
      #open-dotpop[hidden] {
        display: none;
      }
      a {
        color: var(--link);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Open a shared pop</h1>
      <p><a id="open-dotpop" hidden>Open in dotpop</a></p>
      <p>dotpop runs on Mac and iPhone. Install it, sign in with Apple, then open this link again to join.</p>
      <p>
        <a href="https://github.com/hitSlop/dotpop/releases/latest/download/dotpop.dmg">Download for Mac</a> ·
        <a href="https://testflight.apple.com/join/F4qfCkgg">Get dotpop for iPhone</a>
      </p>
    </main>
    <script>
      const link = document.getElementById("open-dotpop");
      const fragment = location.hash.slice(1);
      if (fragment) {
        link.href = "dotpop://join#" + fragment;
        link.hidden = false;
      }
    </script>
  </body>
</html>
