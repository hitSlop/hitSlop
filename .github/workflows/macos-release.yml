name: Release macOS

on:
  push:
    tags:
      - "macos-v*"
  # Manual runs validate the full release gate without signing or publishing.
  workflow_dispatch:

concurrency:
  group: macos-release-${{ github.ref_name }}
  cancel-in-progress: false

permissions: {}

jobs:
  release:
    name: ${{ github.event_name == 'push' && 'Sign, notarize, and publish' || 'Release check (dry run)' }}
    if: github.repository == 'hitslop/hitslop'
    runs-on: macos-15
    permissions:
      contents: write
    # Signing and notarization secrets are scoped to the steps that use them, so
    # dependency installs, the test suite and third-party actions never see them.
    env:
      # The gate and the archive build what ships: the `dist` Cargo profile.
      HITSLOP_CARGO_PROFILE: dist
      HITSLOP_DEVELOPMENT_TEAM: "78UAXU8QG8"
      HITSLOP_CODESIGN_IDENTITY: "Developer ID Application: Mushroom DAO Holdings Corp. (78UAXU8QG8)"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Validate release secrets
        if: github.event_name == 'push'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          for name in MACOS_CERTIFICATE MACOS_CERTIFICATE_PASSWORD KEYCHAIN_PASSWORD ASC_API_KEY_ID ASC_API_ISSUER_ID ASC_API_KEY_P8 SPARKLE_PRIVATE_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing release secret: $name"
              exit 1
            fi
          done
      - uses: ./.github/actions/prepare-checks
      - uses: ./.github/actions/native-cache
        with:
          templates: release
      - name: Check release identity
        if: github.event_name == 'push'
        run: bun scripts/release/bundle.ts --preflight
      - run: bun install --cwd apps/landing --frozen-lockfile
      - run: brew install xcodegen
      # Tags accept the signed Release app during packaging instead of building a Debug app.
      - name: Validate release artifacts
        run: bun run release:check ${{ github.event_name == 'push' && '--skip-app' || '' }}
        env:
          HITSLOP_TEMPLATE_CACHE_DIR: .hitslop/template-cache
          # Tags require their frozen tests/compat entry.
          HITSLOP_RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || '' }}
      - name: Import Developer ID certificate
        if: github.event_name == 'push'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          CERTIFICATE_PATH="$RUNNER_TEMP/hitslop-certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/hitslop-signing.keychain-db"
          printf '%s' "$MACOS_CERTIFICATE" | base64 -D > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
      - name: Package notarized DMG
        if: github.event_name == 'push'
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p .hitslop/evidence
          scripts/release/package-macos-release.sh 2>&1 | tee .hitslop/evidence/packaging.log
      - name: Verify Gatekeeper
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#macos-v}"
          APP="$RUNNER_TEMP/verify/hitSlop.app"
          mkdir -p "$RUNNER_TEMP/verify"
          hdiutil attach "dist/macos/hitSlop-${VERSION}.dmg" -nobrowse -mountpoint "$RUNNER_TEMP/dmg"
          ditto "$RUNNER_TEMP/dmg/hitSlop.app" "$APP"
          hdiutil detach "$RUNNER_TEMP/dmg"
          test "$(lipo -archs "$APP/Contents/MacOS/hitSlop")" = "arm64"
          test "$(lipo -archs "$APP/Contents/Helpers/hitslop-native")" = "arm64"
          test "$(lipo -archs "$APP/Contents/Helpers/slop-engine")" = "arm64"
          test "$("$APP/Contents/Helpers/slop-engine" --build-id)" = "$("$APP/Contents/Helpers/hitslop-native" --core-build)"
          codesign --verify --deep --strict --verbose=2 "$APP"
          spctl --assess --type execute --verbose=2 "$APP"
          stapler validate "dist/macos/hitSlop-${VERSION}.dmg"
          bun scripts/release/artifact.ts "$APP"
          mkdir -p "$RUNNER_TEMP/verify-zip"
          ditto -x -k "dist/macos/hitSlop-${VERSION}.zip" "$RUNNER_TEMP/verify-zip"
          codesign --verify --deep --strict "$RUNNER_TEMP/verify-zip/hitSlop.app"
          spctl --assess --type execute "$RUNNER_TEMP/verify-zip/hitSlop.app"
          (cd dist/macos && shasum -a 256 -c SHA256SUMS)
      - name: Retain tested npm packages
        if: github.event_name == 'push'
        run: |
          bun scripts/release/bundle.ts
          (cd dist/macos && shasum -a 256 -c SHA256SUMS)
      - name: Publish GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#macos-v}"
          NOTES="$RUNNER_TEMP/release-notes.md"
          SDK_VERSION=$(bun -e 'console.log((await Bun.file("dist/macos/release-record.json").json()).packageVersions.document)')
          CLI_VERSION=$(bun -e 'console.log((await Bun.file("dist/macos/release-record.json").json()).packageVersions.cli)')
          cat > "$NOTES" <<EOF
          hitSlop $VERSION for Apple silicon Macs.

          Signed and notarized by Apple (Developer ID: Mushroom DAO Holdings Corp.).
          Requires a Mac with an Apple M-series processor and macOS 15.2 or newer.
          Drag hitSlop.app into Applications, then create a document from the included template collection.

          The included authoring packages are @hitslop/schema and @hitslop/document $SDK_VERSION, with @hitslop/cli $CLI_VERSION.
          EOF
          gh release create "$GITHUB_REF_NAME" \
            --title "hitSlop $VERSION" \
            --notes-file "$NOTES" \
            "dist/macos/hitSlop-${VERSION}.dmg" \
            "dist/macos/hitSlop-${VERSION}.zip" \
            dist/macos/hitSlop.dmg \
            dist/macos/hitSlop.zip \
            dist/macos/appcast.xml \
            dist/macos/SHA256SUMS \
            dist/macos/hitslop-*.tgz \
            dist/macos/release-record.json
      - name: Remove temporary signing credentials
        if: always()
        run: |
          set -euo pipefail
          trap 'rm -f "$RUNNER_TEMP/hitslop-certificate.p12"' EXIT
          KEYCHAIN_PATH="$RUNNER_TEMP/hitslop-signing.keychain-db"
          if [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: release-evidence
          path: |
            .hitslop/evidence
            dist/macos/release-record.json
            dist/macos/SHA256SUMS
          include-hidden-files: true
