name: Release hitSlop

on:
  workflow_dispatch:

permissions: {}

jobs:
  preflight:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.2"
      - id: check
        run: bun scripts/release/preflight.ts
        env:
          GH_TOKEN: ${{ github.token }}
  engines:
    needs: preflight
    uses: ./.github/workflows/engines.yml
    permissions:
      contents: read
  candidate:
    needs: [preflight, engines]
    name: Build and test candidate
    runs-on: macos-15
    timeout-minutes: 180
    permissions:
      contents: read
      actions: read
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      record-sha: ${{ steps.bundle.outputs.record-sha }}
    env:
      HITSLOP_CARGO_PROFILE: dist
      HITSLOP_RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
      HITSLOP_DEVELOPMENT_TEAM: "78UAXU8QG8"
      HITSLOP_CODESIGN_IDENTITY: "Developer ID Application: Mushroom DAO Holdings Corp. (78UAXU8QG8)"
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Require a new dispatch for candidate builds
        run: |
          if [ "$GITHUB_RUN_ATTEMPT" != 1 ]; then
            echo '::error::Start a new workflow dispatch to rebuild a candidate. Retry only failed publication jobs.'
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Validate release secrets
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          for name in MACOS_CERTIFICATE MACOS_CERTIFICATE_PASSWORD KEYCHAIN_PASSWORD ASC_API_KEY_ID ASC_API_ISSUER_ID ASC_API_KEY_P8 SPARKLE_PRIVATE_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing release secret: $name"
              exit 1
            fi
          done
      - id: prepare
        uses: ./.github/actions/prepare-checks
        with:
          cache-scope: release
          bindings: full
          webkit: "true"
          save-build-cache: "false"
      - id: native-cache
        uses: ./.github/actions/native-cache
        with:
          templates: release
          save-build-cache: "false"
      - name: Download candidate engines
        run: |
          gh run download "$GITHUB_RUN_ID" --pattern 'engine-*' --dir generated/engine-artifacts
          mkdir -p generated/engines
          for folder in generated/engine-artifacts/engine-*; do cp -R "$folder/" generated/engines/; done
          chmod +x generated/engines/*/slop-engine
      - run: brew install xcodegen
      - name: Check the command prelude before capture
        run: bun run compat:runner --check
      - name: Capture this candidate outside Git
        run: bun run compat:capture "${HITSLOP_RELEASE_TAG#v}" --writer generated/engines/darwin-arm64/slop-engine --out dist/corpus
      - name: Resolve all released corpora and the candidate
        run: bun scripts/compat/corpora.ts
        env:
          HITSLOP_COMPAT_CANDIDATE: ${{ github.workspace }}/dist/corpus
      - name: Validate release artifacts
        run: |
          bun run release:check --skip-app
          test -z "$(git status --porcelain)"
        env:
          HITSLOP_TEMPLATE_CACHE_DIR: .hitslop/template-cache
          HITSLOP_ENGINE: ${{ github.workspace }}/generated/engines/darwin-arm64/slop-engine
      # actions/cache's automatic save runs only after a successful job. Preserve
      # completed compilation now, so a later Apple service failure cannot discard it.
      - name: Trim Rust cache before checkpointing
        if: steps.prepare.outputs.rust-cache-hit != 'true'
        run: bash scripts/ci/prune-cargo-target.sh
      - name: Checkpoint Rust compilation
        if: steps.prepare.outputs.rust-cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.prepare.outputs.rust-cache-key }}
      - name: Checkpoint binding generators
        if: steps.prepare.outputs.tools-cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: generated/core-tools
          key: ${{ steps.prepare.outputs.tools-cache-key }}
      - name: Checkpoint SwiftPM compilation
        if: steps.native-cache.outputs.swift-cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: apps/apple/Packages/HitSlopApple/.build
          key: ${{ steps.native-cache.outputs.swift-cache-key }}
      - name: Checkpoint completed templates
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .hitslop/template-cache
          key: ${{ steps.native-cache.outputs.template-cache-key }}
      - name: Import Developer ID certificate
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          CERTIFICATE_PATH="$RUNNER_TEMP/hitslop-certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/hitslop-signing.keychain-db"
          printf '%s' "$MACOS_CERTIFICATE" | base64 -D > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
      - name: Package notarized DMG
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p .hitslop/evidence
          scripts/release/package-macos-release.sh 2>&1 | tee .hitslop/evidence/packaging.log
      - name: Verify Gatekeeper
        run: |
          set -euo pipefail
          VERSION="${HITSLOP_RELEASE_TAG#v}"
          APP="$RUNNER_TEMP/verify/hitSlop.app"
          mkdir -p "$RUNNER_TEMP/verify"
          hdiutil attach "dist/macos/hitSlop-${VERSION}.dmg" -nobrowse -mountpoint "$RUNNER_TEMP/dmg"
          ditto "$RUNNER_TEMP/dmg/hitSlop.app" "$APP"
          hdiutil detach "$RUNNER_TEMP/dmg"
          test "$(lipo -archs "$APP/Contents/MacOS/hitSlop")" = "arm64"
          test "$(lipo -archs "$APP/Contents/Helpers/hitslop-evaluator")" = "arm64"
          codesign --verify --deep --strict --verbose=2 "$APP"
          spctl --assess --type execute --verbose=2 "$APP"
          sh scripts/release/stapler.sh validate "dist/macos/hitSlop-${VERSION}.dmg"
          bun scripts/release/artifact.ts "$APP"
          mkdir -p "$RUNNER_TEMP/verify-zip"
          ditto -x -k "dist/macos/hitSlop-${VERSION}.zip" "$RUNNER_TEMP/verify-zip"
          codesign --verify --deep --strict "$RUNNER_TEMP/verify-zip/hitSlop.app"
          spctl --assess --type execute "$RUNNER_TEMP/verify-zip/hitSlop.app"
          (cd dist/macos && shasum -a 256 -c SHA256SUMS)
      # Xcode rewrites its lockfile during archive. Restore that known rewrite, then
      # require every tracked source to remain clean.
      - name: Restore tracked files Xcode rewrote
        run: |
          git restore apps/apple/Packages/HitSlopApple/Package.resolved
          test -z "$(git status --porcelain)"
      - name: Retain tested packages and corpus
        id: bundle
        run: |
          bun scripts/release/bundle.ts
          (cd dist/macos && shasum -a 256 -c SHA256SUMS)
      - name: Retain exact candidate
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-candidate-${{ github.run_attempt }}
          path: dist/macos
          retention-days: 90
      - name: Manual acceptance instructions
        run: |
          {
            echo '### Candidate ready for hand acceptance'
            echo 'Download release-candidate-${{ github.run_attempt }}, install its DMG, and complete docs/guides/releasing.md.'
            echo 'Approve the release environment only after accepting these exact bytes. Reject it for a rehearsal.'
            echo 'Record SHA-256: ${{ steps.bundle.outputs.record-sha }}'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Remove temporary signing credentials
        if: always()
        run: |
          set -euo pipefail
          trap 'rm -f "$RUNNER_TEMP/hitslop-certificate.p12"' EXIT
          KEYCHAIN_PATH="$RUNNER_TEMP/hitslop-signing.keychain-db"
          if [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: release-evidence-${{ github.run_attempt }}
          path: |
            .hitslop/evidence
            dist/macos/release-record.json
            dist/macos/SHA256SUMS
          include-hidden-files: true

  publish:
    needs: [preflight, candidate]
    name: Publish accepted candidate
    runs-on: ubuntu-latest
    # Human acceptance of the retained DMG is the only approval. Waiting candidates
    # do not lock publication; stale candidates fail after approval, before tagging.
    environment: release
    concurrency:
      group: hitslop-publication
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      HITSLOP_RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
      HITSLOP_CANDIDATE_ID: ${{ needs.candidate.outputs.artifact-id }}
      HITSLOP_CANDIDATE_SHA: ${{ needs.candidate.outputs.record-sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.2"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Restore and verify approved candidate
        run: bun scripts/release/publish.ts restore
      - name: Stage all exact assets
        run: bun scripts/release/publish.ts stage
      - name: Publish permanent compatibility evidence
        run: bun scripts/release/publish.ts lock
      - run: npm install -g npm@11.21.0
      - name: Publish exact npm tarball
        run: bun scripts/release/publish.ts npm
      - name: Promote npm and Sparkle
        run: bun scripts/release/publish.ts promote
