name: Block AI Attribution

on:
  pull_request_target:
    branches: [master]
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read
  statuses: write

concurrency:
  group: attribution-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  inspect:
    # The script publishes the required Attribution status on the PR head SHA.
    name: Inspect attribution
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Always execute the default branch's policy, never a PR's replacement script.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"
      - name: Inspect incoming commit objects and PR metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/ci/attribution.ts
