name: Deploy website

on:
  push:
    branches: [master]
    paths:
      - apps/landing/**
      - .github/workflows/website.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tinys-website
  cancel-in-progress: false

jobs:
  deploy:
    if: vars.TINYS_DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.2"
      - run: bun install --cwd apps/landing --frozen-lockfile
      - run: bun run --cwd apps/landing check
      - run: bun run --cwd apps/landing build
      - run: bun run --cwd apps/landing deploy:built
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
