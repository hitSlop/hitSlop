name: Runtime contracts
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      render_corpus:
        description: Verify warm template reuse and profile every bundled/preserved render
        type: boolean
        default: false
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/prepare-checks
      - run: bun run hygiene
      - run: bun run check
      - run: bun run test
      # Published tarballs installed outside the checkout: exports, types, init and preview.
      - run: bun run packages:pack
      - run: bun run test:packed
      - run: bun install --cwd apps/landing --frozen-lockfile
      - run: bun run landing:check
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: fast-evidence
          path: .hitslop/v1-evidence
          include-hidden-files: true
  native:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: paths
        with:
          filters: |
            native:
              - 'apps/apple/**'
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'packages/document/src/**'
              - 'packages/schema/src/**'
              - 'packages/cli/src/**'
              - 'packages/cli/templates/**'
              - 'packages/cli/skills/hitslop-document/**'
              - 'packages/cli/tests/fixtures/**'
              - 'packages/*/tests/**/*.native.test.ts'
              - 'packages/*/package.json'
              - 'scripts/**'
              - 'tests/**'
              - 'examples/slops/**'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'
              - 'bun.lock'
              - 'package.json'
              - 'tsconfig*.json'
      - uses: ./.github/actions/prepare-checks
        if: steps.paths.outputs.native == 'true'
      - uses: ./.github/actions/native-cache
        if: steps.paths.outputs.native == 'true'
        with:
          templates: fixtures
      # Fixtures only; the full template corpus, check:built and the app build run on release.
      - name: Validate native boundaries
        if: steps.paths.outputs.native == 'true'
        env:
          HITSLOP_TEMPLATE_CACHE_DIR: .hitslop/template-cache
        run: |
          bun run build
          bun run swift:test
          bun run test:native
          bun run test:render --fixtures
          bun run test:native-helper
          bun scripts/v1/crash-matrix.ts
      - name: Native unaffected
        if: steps.paths.outputs.native == 'false'
        run: echo 'No native inputs changed'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && steps.paths.outputs.native == 'true'
        with:
          name: native-evidence
          path: .hitslop/v1-evidence
          include-hidden-files: true
  # Tag runs can only restore caches saved on the default branch, so master keeps the
  # full template corpus warm for the next release. Manual runs can also profile
  # the complete render corpus without signing or publishing. Not a required check.
  release-templates:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/master') || (github.event_name == 'workflow_dispatch' && inputs.render_corpus)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/prepare-checks
      - uses: ./.github/actions/native-cache
        with:
          templates: release
      - name: Build release templates
        env:
          HITSLOP_TEMPLATE_CACHE_DIR: .hitslop/template-cache
        run: |
          bun run build
          bun run build:templates
      - name: Verify warm template cache and profile full render corpus
        if: github.event_name == 'workflow_dispatch' && inputs.render_corpus
        env:
          HITSLOP_TEMPLATE_CACHE_DIR: .hitslop/template-cache
        run: |
          cp .hitslop/v1-evidence/template-cache-templates.json .hitslop/v1-evidence/template-cache-first-build.json
          bun run build:templates
          bun -e 'import { strict as assert } from "node:assert"; const report = await Bun.file(".hitslop/v1-evidence/template-cache-templates.json").json(); const inventory = await Bun.file("generated/v1/templates/inventory.json").json(); assert.equal(report.built, 0); assert.equal(report.hits, inventory.templates.length);'
          bun run test:render
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: release-templates-evidence
          path: .hitslop/v1-evidence
          include-hidden-files: true
