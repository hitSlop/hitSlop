name: CI
on:
  pull_request:
  push:
    branches: [master, "release/*"]
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:
    inputs:
      render_corpus:
        description: Profile every bundled/preserved render
        type: boolean
        default: false
      cache_namespace:
        description: Optional isolated cache prefix for cold/warm CI validation
        type: string
        default: ""
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
env:
  CI_CACHE_NAMESPACE: ${{ github.event_name == 'workflow_dispatch' && inputs.cache_namespace || '' }}
  # What a pull request or push changed: the pull request's target, or the commit a push
  # replaced. Nightly, manual and release-branch runs always check every tier.
  CHANGE_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event_name == 'push' && github.event.before || '' }}
jobs:
  # No dependency installation or compilation: decide before allocating macOS.
  select:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      fast: ${{ steps.select.outputs.fast }}
      native: ${{ steps.select.outputs.native }}
      rust: ${{ steps.select.outputs.rust }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"
      - name: Select affected tiers
        id: select
        shell: bash
        run: |
          bun scripts/ci/select.ts > selection.json
          jq -r '.tiers[] | "\(.name): \(.reason)"' selection.json >> "$GITHUB_STEP_SUMMARY"
          echo "fast=$(jq -r '[.tiers[].name | select(. == "compat" or . == "tooling" or . == "contracts" or . == "types" or . == "bun" or . == "cli" or . == "packed" or . == "landing")] | join(",")' selection.json)" >> "$GITHUB_OUTPUT"
          echo "native=$(jq -r '[.tiers[].name | select(. == "rust" or . == "cli" or . == "packed" or . == "swift" or . == "browser" or . == "native")] | join(",")' selection.json)" >> "$GITHUB_OUTPUT"
          echo "rust=$(jq -r '[.tiers[].name | select(. == "rust")] | join(",")' selection.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-selection
          path: selection.json
  # Always reports: a failed/cancelled selector must never turn required checks green.
  fast:
    needs: select
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TIERS: ${{ needs.select.outputs.fast }}
    steps:
      - name: Require successful selection
        env:
          SELECTION_RESULT: ${{ needs.select.result }}
        run: test "$SELECTION_RESULT" = success
      - if: env.TIERS != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/prepare-checks
        if: env.TIERS != ''
        with:
          bindings: ${{ (contains(env.TIERS, 'bun') || contains(env.TIERS, 'cli')) && 'portable' || 'none' }}
          nextest: "false"
          rust: ${{ contains(env.TIERS, 'contracts') || contains(env.TIERS, 'bun') || contains(env.TIERS, 'cli') || contains(env.TIERS, 'packed') }}
          dependencies: ${{ env.TIERS != 'compat' }}
      - run: bun install --cwd apps/landing --frozen-lockfile
        if: contains(env.TIERS, 'landing')
      - run: bun run verify --ci --keep-going "$TIERS"
        if: env.TIERS != ''
        env:
          HITSLOP_COMPAT_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || (github.event.before != '0000000000000000000000000000000000000000' && github.event.before) || 'origin/master' }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && env.TIERS != ''
        with:
          name: fast-evidence
          path: .hitslop/evidence
          include-hidden-files: true
  native:
    needs: select
    if: needs.select.outputs.native != ''
    runs-on: macos-15
    timeout-minutes: 45
    env:
      TIERS: ${{ needs.select.outputs.native }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/prepare-checks
        with:
          nextest: ${{ contains(env.TIERS, 'rust') }}
          bindings: ${{ (contains(env.TIERS, 'swift') || contains(env.TIERS, 'native')) && 'native' || contains(env.TIERS, 'cli') && 'portable' || 'none' }}
          dependencies: ${{ env.TIERS != 'rust' }}
          webkit: ${{ contains(env.TIERS, 'browser') }}
      - uses: ./.github/actions/native-cache
        if: contains(env.TIERS, 'swift') || contains(env.TIERS, 'native')
        with:
          templates: fixtures
      - name: Native tiers
        env:
          HITSLOP_TEMPLATE_CACHE_DIR: .hitslop/template-cache
        run: bun run verify --ci --keep-going "$TIERS"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: native-evidence
          path: .hitslop/evidence
          include-hidden-files: true
  # Full Rust semantics plus both SQLite configurations, when affected.
  linux-smoke:
    needs: select
    if: needs.select.outputs.rust != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TIERS: ${{ needs.select.outputs.rust }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/prepare-checks
        with:
          bindings: none
          dependencies: "false"
      - run: bun run verify --ci --keep-going "$TIERS"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: linux-rust-evidence
          path: .hitslop/evidence
          include-hidden-files: true
  # Nightly runs keep the default branch's full template corpus warm for releases.
  # Manual runs can also profile
  # the complete render corpus without signing or publishing. Not a required check.
  release-templates:
    timeout-minutes: 60
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.render_corpus)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/prepare-checks
        with:
          cache-scope: templates
      - uses: ./.github/actions/native-cache
        with:
          templates: release
      - name: Build release templates
        env:
          HITSLOP_TEMPLATE_CACHE_DIR: .hitslop/template-cache
        run: |
          bun run build
          bun run build:templates
      - name: Profile full render corpus
        env:
          HITSLOP_TEMPLATE_CACHE_DIR: .hitslop/template-cache
          HITSLOP_RENDER: all
        run: bun run verify native render
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: release-templates-evidence
          path: .hitslop/evidence
          include-hidden-files: true
