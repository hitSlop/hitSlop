name: Deploy sharing

# The live-sharing relay and its browser host (share.hitslop.com, *.dotslop.com) follow master.
# The relay's /v1 wire contract is frozen (crates/hitslop-sharing-protocol/tests/fixtures/v1).
on:
  push:
    branches: [master]
    paths:
      - apps/sharing/**
      - crates/hitslop-sharing-*/**
      - crates/hitslop-core/**
      - crates/hitslop-core-wasm/**
      - packages/hitslop/src/browser/**
      - packages/hitslop/src/shell/**
      - packages/hitslop/src/cli/frame-document.ts
      - scripts/build/sharing.ts
      - scripts/sharing/**
      - .github/workflows/sharing.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hitslop-sharing
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/master'
    # Miniflare qualification is proven on macOS; it fails before any check on the Linux runner.
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/prepare-checks
        with:
          nextest: "false"
          bindings: portable
      - name: Build
        run: bun scripts/build/sharing.ts
      # The built WASM relay on Miniflare: create, join, Stop, account deletion, limits, AASA.
      - name: Qualify
        run: bun run verify sharing
      - name: Deploy relay
        run: bunx wrangler@4.46.0 deploy --config apps/sharing/wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy host
        run: bunx wrangler@4.46.0 deploy --config apps/sharing/host.wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Smoke
        run: |
          test "$(curl -s -o /dev/null -w '%{http_code}' https://share.hitslop.com/health)" = 200
          curl -sf https://share.hitslop.com/.well-known/apple-app-site-association | grep -q '"applinks"'
