name: Bug report
description: Report a reproducible problem in pop
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve pop. Do not include secrets or private documents.
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - macOS app
        - Authoring CLI
        - Svelte SDK
        - Local template catalog
        - A bundled example
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Include the expected behavior and a minimal reproduction.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version and environment
      placeholder: pop version, macOS version, Bun version
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      render: shell
