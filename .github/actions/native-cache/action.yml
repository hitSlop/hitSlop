name: Native build cache
description: Reuse compatible SwiftPM and completed template builds (pull requests restore only)
inputs:
  swift:
    description: Cache SwiftPM (disable for engine-only template builds)
    default: "true"
  templates:
    description: "Template cache set: fixtures (everyday CI) or release (full corpus)"
    required: true
  save-build-cache:
    description: Save caches at job completion; disable when the caller checkpoints them explicitly
    default: "true"
outputs:
  swift-cache-key:
    description: Key for checkpointing SwiftPM before later release steps
    value: ${{ steps.cache-keys.outputs.swift }}
  swift-cache-hit:
    description: Whether the exact SwiftPM cache was restored
    value: ${{ steps.swift-cache.outputs.cache-hit || steps.swift-cache-restore.outputs.cache-hit }}
  template-cache-key:
    description: Key for checkpointing completed template builds
    value: ${{ steps.cache-keys.outputs.templates }}
runs:
  using: composite
  steps:
    - id: toolchain
      if: inputs.swift == 'true'
      shell: bash
      run: |
        TOOLCHAIN_HASH=$( (xcodebuild -version; swift --version) | shasum -a 256 | cut -d ' ' -f 1)
        echo "hash=$TOOLCHAIN_HASH" >> "$GITHUB_OUTPUT"
    - id: cache-keys
      shell: bash
      env:
        SWIFT_KEY: ${{ env.CI_CACHE_NAMESPACE }}swiftpm-${{ inputs.templates }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.hash }}-${{ hashFiles('apps/apple/Packages/TinysApple/Package.resolved', 'apps/apple/Packages/TinysApple/Package.swift') }}-${{ hashFiles('apps/apple/Packages/TinysApple/Sources/**', 'apps/apple/Packages/TinysApple/Tests/**', 'crates/**', 'Cargo.lock', 'rust-toolchain.toml', 'packages/tinys/**', 'bun.lock') }}
        TEMPLATE_KEY: ${{ env.CI_CACHE_NAMESPACE }}templates-v3-${{ inputs.templates }}-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
      run: |
        echo "swift=$SWIFT_KEY" >> "$GITHUB_OUTPUT"
        echo "templates=$TEMPLATE_KEY" >> "$GITHUB_OUTPUT"
    - id: swift-cache
      if: inputs.swift == 'true' && github.event_name != 'pull_request' && inputs.save-build-cache == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: apps/apple/Packages/TinysApple/.build
        key: ${{ steps.cache-keys.outputs.swift }}
        restore-keys: ${{ env.CI_CACHE_NAMESPACE }}swiftpm-${{ inputs.templates }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.hash }}-${{ hashFiles('apps/apple/Packages/TinysApple/Package.resolved', 'apps/apple/Packages/TinysApple/Package.swift') }}-
    - id: swift-cache-restore
      if: inputs.swift == 'true' && (github.event_name == 'pull_request' || inputs.save-build-cache != 'true')
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: apps/apple/Packages/TinysApple/.build
        key: ${{ steps.cache-keys.outputs.swift }}
        restore-keys: ${{ env.CI_CACHE_NAMESPACE }}swiftpm-${{ inputs.templates }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.hash }}-${{ hashFiles('apps/apple/Packages/TinysApple/Package.resolved', 'apps/apple/Packages/TinysApple/Package.swift') }}-
    - id: template-cache
      if: github.event_name != 'pull_request' && inputs.save-build-cache == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .tinys/template-cache
        key: ${{ steps.cache-keys.outputs.templates }}
        restore-keys: ${{ env.CI_CACHE_NAMESPACE }}templates-v3-${{ inputs.templates }}-${{ runner.os }}-${{ runner.arch }}-
    - id: template-cache-restore
      if: github.event_name == 'pull_request' || inputs.save-build-cache != 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .tinys/template-cache
        key: ${{ steps.cache-keys.outputs.templates }}
        restore-keys: ${{ env.CI_CACHE_NAMESPACE }}templates-v3-${{ inputs.templates }}-${{ runner.os }}-${{ runner.arch }}-
    - name: Native cache summary
      shell: bash
      env:
        SWIFT_HIT: ${{ steps.swift-cache.outputs.cache-hit || steps.swift-cache-restore.outputs.cache-hit }}
        TEMPLATE_HIT: ${{ steps.template-cache.outputs.cache-hit || steps.template-cache-restore.outputs.cache-hit }}
      run: |
        status() {
          case "$1" in true) echo 'exact hit';; false) echo 'fallback hit';; *) echo 'miss';; esac
        }
        {
          echo '### Native caches'
          echo '| Cache | Restore |'
          echo '|---|---|'
          echo "| SwiftPM | $(status "$SWIFT_HIT") |"
          echo "| Templates | $(status "$TEMPLATE_HIT") |"
        } >> "$GITHUB_STEP_SUMMARY"
