name: Prepare checks
description: Install pinned tools and restore immutable historical readers
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: "22"
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: "1.4.2"
    - run: bun install --frozen-lockfile
      shell: bash
    - run: bun scripts/v1/ci-baseline.ts
      shell: bash
    - run: bun run compatibility:restore
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
