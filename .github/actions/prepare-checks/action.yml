name: Prepare checks
description: Install pinned tools
runs:
  using: composite
  steps:
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: "22"
        package-manager-cache: false
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: "1.4.2"
    - run: bun install --frozen-lockfile
      shell: bash
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
          generated/core-tools
        key: rust-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-${{ hashFiles('crates/**', 'scripts/v1/core-build.ts') }}
        restore-keys: rust-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-
    - name: Prepare shared Rust core toolchain
      shell: bash
      run: |
        rustup show active-toolchain
        rustup target add wasm32-unknown-unknown
        cargo install wasm-bindgen-cli --version 0.2.127 --locked --root generated/core-tools
    - run: bun run core:build:wasm
      shell: bash
    - run: bun run core:test
      shell: bash
