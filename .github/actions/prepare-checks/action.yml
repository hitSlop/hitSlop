name: Prepare checks
description: Install pinned tools; checks run through `bun run verify`
inputs:
  cache-scope:
    description: "Build workload: checks, templates, or release (prevents partial builds filling the checks cache)"
    default: checks
  bindings:
    description: "Binding generators: native, portable, or none"
    default: native
  nextest:
    description: Install cargo-nextest
    default: "true"
  rust:
    description: Prepare Rust tools and caches
    default: "true"
  dependencies:
    description: Install workspace dependencies
    default: "true"
  webkit:
    description: Install Playwright WebKit and Google Chrome for browser tests
    default: "false"
runs:
  using: composite
  steps:
    - id: started
      shell: bash
      run: echo "seconds=$(date +%s)" >> "$GITHUB_OUTPUT"
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: "22"
        package-manager-cache: false
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: "1.4.2"
    # Pull requests restore caches but never save them: a pull request's cache is visible
    # only to that pull request, and saving each one evicted the default branch's caches
    # from the repository's 10 GB budget. Pushes, nightly and manual runs save.
    - id: rust-cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      if: inputs.rust == 'true' && github.event_name != 'pull_request'
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ env.CI_CACHE_NAMESPACE }}rust-${{ inputs.cache-scope }}-${{ inputs.bindings }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-${{ hashFiles('crates/**', 'scripts/build/core.ts') }}
        restore-keys: ${{ env.CI_CACHE_NAMESPACE }}rust-${{ inputs.cache-scope }}-${{ inputs.bindings }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-
    - id: rust-cache-restore
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      if: inputs.rust == 'true' && github.event_name == 'pull_request'
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ env.CI_CACHE_NAMESPACE }}rust-${{ inputs.cache-scope }}-${{ inputs.bindings }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-${{ hashFiles('crates/**', 'scripts/build/core.ts') }}
        restore-keys: ${{ env.CI_CACHE_NAMESPACE }}rust-${{ inputs.cache-scope }}-${{ inputs.bindings }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-
    - id: tools-cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      if: inputs.rust == 'true' && inputs.bindings != 'none' && github.event_name != 'pull_request'
      with:
        path: generated/core-tools
        key: ${{ env.CI_CACHE_NAMESPACE }}core-tools-${{ runner.os }}-${{ runner.arch }}-${{ inputs.bindings }}-wasm-0.2.129-uniffi-0.32.2-binaryen-132
    - id: tools-cache-restore
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      if: inputs.rust == 'true' && inputs.bindings != 'none' && github.event_name == 'pull_request'
      with:
        path: generated/core-tools
        key: ${{ env.CI_CACHE_NAMESPACE }}core-tools-${{ runner.os }}-${{ runner.arch }}-${{ inputs.bindings }}-wasm-0.2.129-uniffi-0.32.2-binaryen-132
    - id: bun-cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      if: inputs.dependencies == 'true' && github.event_name != 'pull_request'
      with:
        path: ~/.bun/install/cache
        key: ${{ env.CI_CACHE_NAMESPACE }}bun-downloads-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock', 'apps/landing/bun.lock') }}
        restore-keys: ${{ env.CI_CACHE_NAMESPACE }}bun-downloads-${{ runner.os }}-${{ runner.arch }}-
    - id: bun-cache-restore
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      if: inputs.dependencies == 'true' && github.event_name == 'pull_request'
      with:
        path: ~/.bun/install/cache
        key: ${{ env.CI_CACHE_NAMESPACE }}bun-downloads-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock', 'apps/landing/bun.lock') }}
        restore-keys: ${{ env.CI_CACHE_NAMESPACE }}bun-downloads-${{ runner.os }}-${{ runner.arch }}-
    - run: bun install --frozen-lockfile
      if: inputs.dependencies == 'true'
      shell: bash
    - name: Install browser test engines
      if: inputs.webkit == 'true'
      run: bun node_modules/playwright/cli.js install webkit chrome
      shell: bash
    - uses: taiki-e/install-action@183e4297cca2404691e9380e1307288dced5c82a # v2.87.25
      if: inputs.rust == 'true' && inputs.nextest == 'true'
      with:
        tool: cargo-nextest@0.9.146
    # A prebuilt binary: compiling it from source took two minutes whenever its cache was evicted.
    - uses: taiki-e/install-action@183e4297cca2404691e9380e1307288dced5c82a # v2.87.25
      if: inputs.rust == 'true' && inputs.bindings != 'none'
      with:
        tool: wasm-bindgen@0.2.129
    # The core's bindings generators, pinned to the library versions in Cargo.lock.
    - name: Prepare shared Rust core toolchain
      if: inputs.rust == 'true'
      shell: bash
      env:
        BINDINGS: ${{ inputs.bindings }}
        WASM_C: ${{ inputs.webkit }}
      run: |
        rustup show active-toolchain
        rustup target add wasm32-unknown-unknown
        # Apple's clang has no WebAssembly backend; only the browser and evaluator WASM
        # builds need Homebrew's (browser qualification and release acceptance).
        if [ "${{ runner.os }}" = macOS ]; then
          if [ "$WASM_C" = true ]; then brew install llvm; fi
        else
          sudo apt-get update
          sudo apt-get install -y clang llvm
        fi
        if [ "$BINDINGS" != none ]; then
          bash scripts/build/install-binaryen.sh
          echo "HITSLOP_WASM_BINDGEN=$(command -v wasm-bindgen)" >> "$GITHUB_ENV"
        fi
        if [ "$BINDINGS" = native ] && [ "$RUNNER_OS" = macOS ]; then
          if [ "$(generated/core-tools/bin/uniffi-bindgen --version 2>/dev/null || true)" != "uniffi-bindgen 0.32.2" ]; then
            cargo install uniffi --version 0.32.2 --features cli --locked --root generated/core-tools --bin uniffi-bindgen --force
          fi
        fi
    - name: Preparation summary
      if: always()
      shell: bash
      env:
        STARTED: ${{ steps.started.outputs.seconds }}
        RUST_ENABLED: ${{ inputs.rust }}
        BINDINGS: ${{ inputs.bindings }}
        DEPENDENCIES: ${{ inputs.dependencies }}
        RUST_HIT: ${{ steps.rust-cache.outputs.cache-hit || steps.rust-cache-restore.outputs.cache-hit }}
        TOOLS_HIT: ${{ steps.tools-cache.outputs.cache-hit || steps.tools-cache-restore.outputs.cache-hit }}
        BUN_HIT: ${{ steps.bun-cache.outputs.cache-hit || steps.bun-cache-restore.outputs.cache-hit }}
      run: |
        status() {
          case "$1" in true) echo 'exact hit';; false) echo 'fallback hit';; *) echo 'miss';; esac
        }
        {
          echo '### Preparation'
          echo "Setup wall time: $(( $(date +%s) - STARTED ))s"
          echo
          echo '| Cache | Restore |'
          echo '|---|---|'
          if [[ "$RUST_ENABLED" == true ]]; then
            echo "| Rust | $(status "$RUST_HIT") |"
            if [[ "$BINDINGS" != none ]]; then echo "| Binding generators | $(status "$TOOLS_HIT") |"; fi
          fi
          if [[ "$DEPENDENCIES" == true ]]; then echo "| Bun downloads | $(status "$BUN_HIT") |"; fi
        } >> "$GITHUB_STEP_SUMMARY"
