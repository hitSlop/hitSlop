[workspace]
members = ["crates/hitslop-core", "crates/hitslop-core-ffi", "crates/hitslop-core-wasm", "crates/slop-engine", "crates/hitslop-runner", "crates/hitslop-sharing-protocol", "apps/sharing", "crates/hitslop-sharing-client"]
resolver = "2"

[workspace.package]
edition = "2024"
publish = false

[workspace.dependencies]
# Exact release: 1.17.1 contains the former main pin (c00c9fa) plus arena, import and undo fixes.
loro = "=1.17.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

# Clippy's default groups warn, and `verify rust` denies warnings; these deny outright.
[workspace.lints.clippy]
correctness = { level = "deny", priority = -1 }
undocumented_unsafe_blocks = "deny"
allow_attributes_without_reason = "deny"

# Development builds (`bun run build`, the Bun, Swift and native tiers): optimized, since the
# core's wall-clock budgets (the text diff's timeout, save scheduling, deadlines) assume it.
# Panics unwind: the owner contains them. Incremental, so an edit recompiles only what changed.
[profile.release]
panic = "unwind"
incremental = true

# What ships (`HITSLOP_CARGO_PROFILE=dist`): the release gate, compatibility capture, the
# Xcode archive and the Engines workflow. Measured: engine 10.4→8.1 MB, app core 9.6→7.4 MB,
# WASM 4.24→3.83 MB, and a core rebuild 24 s→120 s, so development keeps `release`.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
incremental = false

# Test builds keep file and line in backtraces, not full debug info: less to write, link
# and keep in `target/`.
[profile.dev]
debug = "line-tables-only"

# Tests run the workspace crates in debug but Loro optimized: the randomized
# publication and model suites are dominated by the dependency's debug speed.
[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.wasm]
inherits = "dist"
opt-level = "z"
panic = "abort"
