[workspace]
members = [
    "apps/sharing",
    "crates/pop-cloud",
    "crates/pop-contracts",
    "crates/pop-core",
    "crates/pop-core-ffi",
    "crates/pop-core-wasm",
    "crates/pop-engine",
    "crates/pop-runner",
    "crates/pop-runtime",
    "crates/pop-sharing-protocol",
    "crates/pop-storage",
    "crates/pop-testkit",
    "tools/pop-bindgen",
    "tools/pop-compat",
]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.96"
publish = false

[workspace.dependencies]
brotli = "=9.0.0"
data-encoding = "=2.11.1"
libc = "0.2"
# Exact release: 1.17.1 contains the former main pin (c00c9fa) plus arena, import and undo fixes.
loro = "=1.17.1"
png = "=0.18.1"
rusqlite = "=0.40.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "=0.11.0"
tempfile = "3"
thiserror = "2.0"
ts-rs = "=12.0.1"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

# Clippy's default groups warn, and `verify rust` denies warnings; these deny outright.
[workspace.lints.clippy]
correctness = { level = "deny", priority = -1 }
undocumented_unsafe_blocks = "deny"
allow_attributes_without_reason = "deny"

# Development builds (`bun run build`, the Bun, Swift and native tiers): optimized, since the
# core's wall-clock budgets (the text diff's timeout, save scheduling, deadlines) assume it.
# Panics unwind: the owner contains them. Incremental, so an edit recompiles only what changed.
[profile.release]
panic = "unwind"
incremental = true

# What ships (`POP_CARGO_PROFILE=dist`): the release gate, compatibility capture, the
# Xcode archive and the Engines workflow. Measured: engine 10.4→8.1 MB, app core 9.6→7.4 MB,
# WASM 4.24→3.83 MB, and a core rebuild 24 s→120 s, so development keeps `release`.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
incremental = false

# Test builds keep file and line in backtraces, not full debug info: less to write, link
# and keep in `target/`.
[profile.dev]
debug = "line-tables-only"

# Tests run the workspace crates in debug but Loro optimized: the randomized
# publication and model suites are dominated by the dependency's debug speed.
[profile.dev.package."*"]
opt-level = 2
debug = false
