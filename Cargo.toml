[workspace]
members = ["crates/hitslop-core", "crates/hitslop-core-ffi", "crates/hitslop-core-wasm", "crates/slop-engine"]
resolver = "2"

[workspace.package]
edition = "2021"
publish = false

[workspace.dependencies]
# Loro main: its fixes (revert_to, malformed-import errors, smaller snapshots) are not on
# crates.io yet. An exact rev; return to `=1.16.x` once one is published.
loro = { git = "https://github.com/loro-dev/loro", rev = "c00c9fa501f8d32f68d6255eacb7035a67fb6ab6" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

[profile.release]
panic = "unwind"

# Test builds keep file and line in backtraces, not full debug info: less to write, link
# and keep in `target/`.
[profile.dev]
debug = "line-tables-only"

# Tests run the workspace crates in debug but Loro optimized: the randomized
# publication and model suites are dominated by the dependency's debug speed.
[profile.dev.package."*"]
opt-level = 2
debug = false
