[workspace]
members = ["crates/hitslop-core", "crates/hitslop-core-ffi", "crates/hitslop-core-wasm"]
resolver = "2"

[workspace.package]
edition = "2021"
publish = false

[workspace.dependencies]
loro = "=1.16.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

[profile.release]
panic = "unwind"

